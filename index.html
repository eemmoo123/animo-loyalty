<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Animo Loyalty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <span class="brandbar__mark">✦</span>
      <span class="brandbar__name">Animo</span>
    </div>

    <!-- LOYALTY CARD -->
    <div class="card">
      <h1 class="card__title">Loyalty Card</h1>
      <p class="card__sub">Five stamps. Sixth cup, on us.</p>

      <div id="stampsRow" class="stamps-row">
        <div class="stamp-slot"></div>
        <div class="stamp-slot"></div>
        <div class="stamp-slot"></div>
        <div class="stamp-slot"></div>
        <div class="stamp-slot"></div>
      </div>

      <div id="statusMsg" class="card__hint">Get a stamp with every cup</div>

      <div class="card__divider"></div>

      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>

      <p class="card__footer-text">Show this code to your barista at checkout</p>
    </div>

    <p class="app-note">Added to your home screen, this opens straight to your card — no app store, no login.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
