<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animo | بطاقة الولاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --cream:#FBF3E6;
    --cream-deep:#F1E4CF;
    --ink:#241A11;
    --ink-soft:#3B2C1E;
    --green:#2E4028;
    --green-deep:#1C2916;
    --brass:#B8905A;
    --brass-soft:#E7C793;
    --muted:#8C7A62;
    --line:#E2D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(120% 90% at 50% -10%, #2B2015 0%, #1A130C 45%, #120C08 100%);
    font-family:'El Messiri','Manrope',sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 44px;
  }
  .wrap{width:100%;max-width:400px;}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;}
  .brandbar__text{display:flex;flex-direction:column;line-height:1;font-family:'Fraunces',serif;}
  .brandbar__name{font-size:19px;font-weight:600;letter-spacing:0.3px;color:var(--brass-soft);direction:ltr;text-align:center;}
  .brandbar__tag{font-family:'Manrope',sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;color:#9C8B72;margin-top:3px;direction:ltr;text-align:center;}
  .card{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:26px;
    padding:34px 24px 28px;
    text-align:center;
    box-shadow:0 24px 48px -16px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
    border:1px solid rgba(255,255,255,0.5);
    overflow:hidden;
  }
  .card__eyebrow{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--brass);margin:0 0 4px;}
  .card__title{font-family:'El Messiri',sans-serif;font-size:25px;font-weight:700;color:var(--green-deep);margin:0;}
  .card__desc-ar{font-size:15px;font-weight:600;color:var(--ink-soft);margin-top:6px;}
  .card__desc-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:12px;color:var(--muted);margin-top:3px;margin-bottom:20px;}
  .stamps-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    margin:15px 0 16px;
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
  }
  .stamp-slot{
    position:relative;
    aspect-ratio:1;
    border-radius:50%;
    border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    background:var(--cream-deep);
  }
  .stamp-slot svg{width:45%;height:45%;}
  .stamp-slot .cup-outline{stroke:var(--muted);fill:none;}
  .stamp-slot.filled{
    border:1.5px solid var(--brass);
    background:radial-gradient(circle at 35% 30%, var(--brass-soft), var(--brass) 85%);
  }
  .stamp-slot.filled .cup-outline{stroke:var(--green-deep);fill:var(--green-deep);}
  .card__hint-ar{font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .card__hint-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:11px;color:var(--muted);margin-top:2px;margin-bottom:14px;}
  .card__hint-ar.is-ready{color:var(--brass);}
  .card__divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
  .card__divider::before,.card__divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .card__divider span{width:6px;height:6px;border-radius:50%;background:var(--brass);flex-shrink:0;}
  .qr-container{
    background:#fff;
    width:156px;
    height:156px;
    margin:0 auto;
    padding:10px;
    border-radius:18px;
    box-shadow:0 8px 20px -6px rgba(46,64,40,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #qrcode img{display:block;width:100%!important;height:100%!important;border-radius:4px;}
  .qr-id{
    direction:ltr;
    font-family:'Manrope',sans-serif;
    font-size:9px;
    color:var(--muted);
    letter-spacing:0.2px;
    margin-top:10px;
    word-break:break-all;
  }
  .card__footer-ar{font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:10px;}
  .card__footer-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:10px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <div class="brandbar__text">
        <span class="brandbar__name">ANIMO</span>
        <span class="brandbar__tag">BAKERY & CAFE</span>
      </div>
    </div>

    <div class="card">
      <div class="card__eyebrow">Loyalty Card</div>
      <h1 class="card__title">بطاقة الولاء</h1>
      
      <div class="card__desc-ar">اشترِ 5 أكواب واحصل على الكوب السادس هدية!</div>
      <div class="card__desc-en">Buy 5 cups, get the 6th on us!</div>

      <div class="stamps-grid" id="stampsGrid">
        <div class="stamp-slot" data-index="0"><svg viewBox="0 0 24 24"><path class="cup-outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></div>
        <div class="stamp-slot" data-index="1"><svg viewBox="0 0 24 24"><path class="cup-outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></div>
        <div class="stamp-slot" data-index="2"><svg viewBox="0 0 24 24"><path class="cup-outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></div>
        <div class="stamp-slot" data-index="3"><svg viewBox="0 0 24 24"><path class="cup-outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></div>
        <div class="stamp-slot" data-index="4"><svg viewBox="0 0 24 24"><path class="cup-outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></div>
      </div>

      <div class="card__hint-ar" id="hintAr">جاري تحميل بيانات البطاقة...</div>
      <div class="card__hint-en" id="hintEn">Loading card status...</div>

      <div class="card__divider"><span></span></div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
      <div class="qr-id" id="customerIdDisplay">ID: Loading...</div>

      <div class="card__footer-ar">اعرض هذا الكود لدى الكاشير لتسجيل ختمك القادم</div>
      <div class="card__footer-en">Show this code at the cashier to collect your stamp</div>
    </div>
  </div>

  <script>
    // توليد أو جلب معرف بصيغة UUID v4 حقيقي ليناسب قاعدة البيانات لديك
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    const urlParams = new URLSearchParams(window.location.search);
    let customerId = urlParams.get('id');
    
    // إذا لم يكن هناك ID في الرابط، يتم إنشاء وتخزين UUID للعميل في متصفحه ليبقى ثابتاً له
    if (!customerId) {
      customerId = localStorage.getItem('animo_customer_uuid');
      if (!customerId) {
        customerId = generateUUID();
        localStorage.setItem('animo_customer_uuid', customerId);
      }
    }

    let currentStamps = parseInt(urlParams.get('stamps')) || 2; 
    const totalStamps = 5;

    document.getElementById('customerIdDisplay').textContent = `ID: ${customerId}`;
    
    // توليد الـ QR بالرابط الصحيح وبمعرف الـ UUID
    new QRCode(document.getElementById("qrcode"), {
      text: `https://animo-bakery.com/cashier/stamp?id=${customerId}`,
      width: 136,
      height: 136,
      colorDark : "#241A11",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    function renderStamps() {
      const slots = document.querySelectorAll('.stamp-slot');
      slots.forEach((slot, index) => {
        if (index < currentStamps) {
          slot.classList.add('filled');
        } else {
          slot.classList.remove('filled');
        }
      });

      const remaining = totalStamps - currentStamps;
      const hintAr = document.getElementById('hintAr');
      const hintEn = document.getElementById('hintEn');

      if (remaining > 0) {
        hintAr.textContent = `متبقي ${remaining} أكواب للحصول على الهدية`;
        hintEn.textContent = `${remaining} stamps away from your reward`;
        hintAr.classList.remove('is-ready');
      } else {
        hintAr.textContent = '🎉 مبروك! لقد حصلت على كوب مجاني!';
        hintEn.textContent = '🎉 Congratulations! Free cup earned!';
        hintAr.classList.add('is-ready');
      }
    }

    renderStamps();
  </script>
</body>
</html>
