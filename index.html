<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animo | مخبز ومقهى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E6;
    --cream-deep:#F1E4CF;
    --ink:#241A11;
    --ink-soft:#3B2C1E;
    --green:#2E4028;
    --green-deep:#1C2916;
    --brass:#B8905A;
    --brass-soft:#E7C793;
    --muted:#8C7A62;
    --line:#E2D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #2B2015 0%, #1A130C 45%, #120C08 100%);
    font-family:'El Messiri','Manrope',sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 44px;
  }
  .wrap{width:100%;max-width:400px;}

  /* ---------- Brand bar ---------- */
  .brandbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:26px;
  }
  .brandbar__mark{
    width:34px;height:34px;border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(231,199,147,0.35);
    flex-shrink:0;
  }
  .brandbar__mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brandbar__text{display:flex;flex-direction:column;line-height:1;font-family:'Fraunces',serif;}
  .brandbar__name{font-size:19px;font-weight:600;letter-spacing:0.3px;color:var(--brass-soft);direction:ltr;}
  .brandbar__tag{font-family:'Manrope',sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;color:#9C8B72;margin-top:3px;direction:ltr;}

  /* ---------- Card ---------- */
  .card{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:26px;
    padding:34px 24px 28px;
    text-align:center;
    box-shadow:0 24px 48px -16px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
    border:1px solid rgba(255,255,255,0.5);
    overflow:hidden;
  }

  .card__eyebrow{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--brass);margin:0 0 4px;}
  .card__title{font-family:'El Messiri',sans-serif;font-size:25px;font-weight:700;color:var(--green-deep);margin:0;}
  .card__sub-en{font-family:'Manrope',sans-serif;direction:ltr;font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-top:5px;margin-bottom:16px;text-transform:uppercase;}

  .card__desc-ar{font-size:15px;font-weight:600;color:var(--ink-soft);margin-top:2px;}
  .card__desc-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:12px;color:var(--muted);margin-top:3px;margin-bottom:20px;}

  /* ---------- Stamps grid ---------- */
  .stamps-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    margin:6px 0 16px;
    max-width:300px;
    margin-left:auto;
    margin-right:auto;
  }
  .stamp-slot{
    position:relative;
    aspect-ratio:1;
    border-radius:50%;
    border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    background:var(--cream-deep);
    cursor:pointer;
    transition:transform .2s ease, background .35s ease, border-color .35s ease, box-shadow .2s ease;
  }
  .stamp-slot:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(46,64,40,0.35);}
  .stamp-slot:active{transform:scale(0.92);}
  .stamp-slot svg{width:44%;height:44%;}
  .stamp-slot .cup-outline{stroke:var(--muted);fill:none;transition:stroke .3s ease;}
  .stamp-slot.filled{
    border:1.5px solid var(--brass);
    background:radial-gradient(circle at 35% 30%, var(--brass-soft), var(--brass) 85%);
    cursor:default;
  }
  .stamp-slot.filled .cup-outline{stroke:var(--green-deep);fill:var(--green-deep);}
  .stamp-slot.filled:hover{transform:none;box-shadow:none;}
  .stamp-slot.just-filled{animation:stampPop .45s cubic-bezier(.34,1.56,.64,1);}
  .stamp-slot.next-up{border-style:solid;border-color:var(--brass-soft);}
  @keyframes stampPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.28);}
    100%{transform:scale(1);}
  }

  .card__hint-ar{font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:color .2s ease;}
  .card__hint-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:11px;color:var(--muted);margin-top:2px;margin-bottom:4px;}
  .card__hint-ar.is-ready{color:var(--brass);}

  /* ---------- Demo controls ---------- */
  .demo-controls{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:14px 0 4px;
  }
  .demo-btn{
    font-family:'Manrope',sans-serif;
    font-size:11.5px;
    font-weight:600;
    border:1px solid var(--line);
    background:#fff;
    color:var(--green-deep);
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .demo-btn:hover{background:var(--cream-deep);box-shadow:0 4px 10px -4px rgba(46,64,40,0.3);}
  .demo-btn:active{transform:scale(0.95);}
  .demo-btn.primary{background:var(--green-deep);color:var(--cream);border-color:var(--green-deep);}
  .demo-btn.primary:hover{background:var(--green);}
  .demo-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

  /* ---------- Reward banner ---------- */
  .reward-banner{
    display:none;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg, var(--green-deep), var(--green));
    color:var(--cream);
    border-radius:14px;
    padding:12px 14px;
    margin:16px 0 4px;
    text-align:right;
  }
  .reward-banner.show{display:flex;}
  .reward-banner__icon{font-size:20px;flex-shrink:0;}
  .reward-banner__text{flex:1;}
  .reward-banner__title{font-size:13.5px;font-weight:700;}
  .reward-banner__sub{direction:ltr;font-family:'Manrope',sans-serif;font-size:10px;color:#D9CCB0;margin-top:2px;}
  .reward-banner__btn{
    font-family:'Manrope',sans-serif;
    font-size:11px;font-weight:700;
    background:var(--brass-soft);
    color:var(--green-deep);
    border:none;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- Divider ---------- */
  .card__divider{display:flex;align-items:center;gap:10px;margin:22px 0 18px;}
  .card__divider::before,.card__divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .card__divider span{width:6px;height:6px;border-radius:50%;background:var(--brass);flex-shrink:0;}

  /* ---------- QR ---------- */
  .qr-wrap{
    position:relative;
    width:172px;height:172px;
    margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 20px -6px rgba(46,64,40,0.25);
  }
  .qr-wrap::before{content:"";position:absolute;inset:-8px;border:1px solid var(--line);border-radius:24px;z-index:-1;}
  #qrcode img,#qrcode canvas{border-radius:6px;}
  .qr-id{
    direction:ltr;
    font-family:'Manrope',sans-serif;
    font-size:9.5px;
    color:var(--muted);
    letter-spacing:0.3px;
    margin:8px 0 6px;
    word-break:break-all;
  }

  .card__footer-ar{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:8px 0 1px;}
  .card__footer-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:10.5px;color:var(--muted);}

  /* ---------- App note ---------- */
  .app-note{
    display:flex;align-items:flex-start;gap:9px;
    max-width:340px;margin:26px auto 0;
    padding:14px 16px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(231,199,147,0.18);
    border-radius:14px;
  }
  .app-note svg{flex-shrink:0;margin-top:2px;}
  .app-note__text{text-align:right;}
  .app-note-ar{font-size:12px;font-weight:600;color:#E9DCC6;}
  .app-note-en{direction:ltr;font-family:'Manrope',sans-serif;font-size:10.5px;color:#8C7C68;margin-top:3px;}
</style>
</head>
<body>

</body>
</html>
