<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animo | مخبز ومقهى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E6;
    --cream-deep:#F1E4CF;
    --ink:#241A11;
    --ink-soft:#3B2C1E;
    --green:#2E4028;
    --green-deep:#1C2916;
    --brass:#B8905A;
    --brass-soft:#E7C793;
    --muted:#8C7A62;
    --line:#E2D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(120% 90% at 50% -10%, #2B2015 0%, #1A130C 45%, #120C08 100%);
    font-family:'El Messiri','Manrope',sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 44px;
  }
  .wrap{width:100%;max-width:400px;}

  .brandbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:26px;
  }
  .brandbar__text{display:flex;flex-direction:column;line-height:1;font-family:'Fraunces',serif;}
  .brandbar__name{font-size:19px;font-weight:600;letter-spacing:0.3px;color:var(--brass-soft);direction:ltr;}
  .brandbar__tag{font-family:'Manrope',sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;color:#9C8B72;margin-top:3px;direction:ltr;}

  .card{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:26px;
    padding:34px 24px 28px;
    text-align:center;
    box-shadow:0 24px 48px -16px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
    border:1px solid rgba(255,255,255,0.5);
    overflow:hidden;
  }

  .card__eyebrow{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--brass);margin:0 0 4px;}
  .card__title{font-family:'El Messiri',sans-serif;font-size:25px;font-weight:700;color:var(--green-deep);margin:0;}
  .card__desc-ar{font-size:15px;font-weight:600;color:var(--ink-soft);margin-top:10px;}

  /* شبكة 5 أكواب */
  .stamps-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    margin:20px 0;
    max-width:300px;
    margin-left:auto;
    margin-right:auto;
  }
  .stamp-slot{
    position:relative;
    aspect-ratio:1;
    border-radius:50%;
    border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    background:var(--cream-deep);
  }
  .stamp-slot.filled{
    border:1.5px solid var(--brass);
    background:radial-gradient(circle at 35% 30%, var(--brass-soft), var(--brass) 85%);
  }
  .stamp-slot.filled span {color: var(--green-deep); font-weight: bold;}
  
  .card__footer-ar{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-top:15px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <div class="brandbar__text">
        <span class="brandbar__name">ANIMO</span>
        <span class="brandbar__tag">BAKERY & CAFE</span>
      </div>
    </div>

    <div class="card">
      <div class="card__eyebrow">Loyalty Card</div>
      <h1 class="card__title">بطاقة الولاء</h1>
      <p class="card__desc-ar">اشترِ 5 أكواب واحصل على الكوب السادس هدية!</p>

      <div class="stamps-grid">
        <div class="stamp-slot filled"><span>1</span></div>
        <div class="stamp-slot filled"><span>2</span></div>
        <div class="stamp-slot"><span>3</span></div>
        <div class="stamp-slot"><span>4</span></div>
        <div class="stamp-slot"><span>5</span></div>
      </div>

      <p class="card__footer-ar">اعرض هذا الكود لدى الكاشير لتسجيلختمك القادم</p>
    </div>
  </div>
</body>
</html>
