<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Animo Staff</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <span class="brandbar__mark">✦</span>
      <span class="brandbar__name">Animo</span>
      <span class="brandbar__tag">Staff</span>
    </div>

    <!-- PIN PANEL -->
    <div id="pinPanel" class="panel">
      <h1 class="panel__title">Enter staff PIN</h1>
      <p class="panel__sub">Unlocks the scanner for this device</p>
      
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="4" inputmode="numeric">
      <button type="button" id="unlockBtn" class="btn btn--primary" style="margin-top: 15px; width: 100%;" onclick="checkPin()">Unlock</button>
      <div id="pinError" class="panel__error"></div>
    </div>

    <!-- SCANNER PANEL -->
    <div id="scanPanel" class="panel panel--scanner hidden">
      <div class="scan-frame">
        <div id="reader"></div>
        <div class="scan-frame__corner scan-frame__corner--tl"></div>
        <div class="scan-frame__corner scan-frame__corner--tr"></div>
        <div class="scan-frame__corner scan-frame__corner--bl"></div>
        <div class="scan-frame__corner scan-frame__corner--br"></div>
      </div>
      <p class="scan-hint">Scan customer QR code</p>
      <button type="button" id="lockBtn" class="btn btn--ghost" onclick="location.reload()">Lock scanner</button>
    </div>
  </div>

  <div id="result" class="result"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  
  <script>
    let html5QrCode = null;

    function checkPin() {
      const pin = document.getElementById('pinInput').value.trim();
      const err = document.getElementById('pinError');
      
      if (pin === '4471') {
        sessionStorage.setItem('animo_staff_pin', pin);
        document.getElementById('pinPanel').classList.add('hidden');
        document.getElementById('scanPanel').classList.remove('hidden');
        startCamera();
      } else {
        err.textContent = 'Incorrect PIN';
      }
    }

    async function startCamera() {
      if (typeof Html5Qrcode === 'undefined') {
        alert("Scanner library not loaded yet, please refresh.");
        return;
      }

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          async (decodedText) => {
            try {
              await html5QrCode.stop();
            } catch (e) {
              console.warn("Scanner stop warning:", e);
            }

            const pin = sessionStorage.getItem('animo_staff_pin');
            const client = supabase.createClient(
              "https://zljlwnqphtbowtjazyqu.supabase.co",
              "sb_publishable_5Q-Zd5dkLvuKqwwRUF6zew_952ZJtqZ"
            );

            const { data, error } = await client.rpc("add_stamp", {
              p_customer_id: decodedText,
              p_pin: pin
            });

            const resEl = document.getElementById('result');
            if (error || !data) {
              resEl.textContent = "Error: " + (error ? error.message : "Failed");
              resEl.className = "result result--show result--error";
            } else {
              const row = Array.isArray(data) ? data[0] : data;
              if (row.reward_earned) {
                resEl.textContent = "🎉 Free coffee! Card reset to 0/5.";
                resEl.className = "result result--show result--reward";
              } else {
                resEl.textContent = `Stamped — ${row.stamps}/5`;
                resEl.className = "result result--show result--ok";
              }
            }

            setTimeout(() => {
              resEl.classList.remove('result--show');
              startCamera();
            }, 1500);
          },
          () => {}
        );
      } catch (err) {
        console.error("Camera start error:", err);
      }
    }

    document.getElementById('pinInput').addEventListener('input', function() {
      if (this.value.length === 4) {
        checkPin();
      }
    });
  </script>
</body>
</html>
