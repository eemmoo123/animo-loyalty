<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Animo Staff</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <span class="brandbar__mark">✦</span>
      <span class="brandbar__name">Animo</span>
      <span class="brandbar__tag">Staff</span>
    </div>

    <div id="pinPanel" class="panel">
      <h1 class="panel__title">Enter staff PIN</h1>
      <p class="panel__sub">Type 4471 to unlock camera</p>
      
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="4" inputmode="numeric">
      <button type="button" id="unlockBtn" class="btn btn--primary" style="margin-top: 15px; width: 100%;">Unlock</button>
      <div id="pinError" class="panel__error"></div>
    </div>

    <div id="scanPanel" class="panel panel--scanner hidden">
      <div class="scan-frame">
        <div id="reader"></div>
        <div class="scan-frame__corner scan-frame__corner--tl"></div>
        <div class="scan-frame__corner scan-frame__corner--tr"></div>
        <div class="scan-frame__corner scan-frame__corner--bl"></div>
        <div class="scan-frame__corner scan-frame__corner--br"></div>
      </div>
      <p class="scan-hint">Scan customer QR code</p>
      <button type="button" id="lockBtn" class="btn btn--ghost">Lock scanner</button>
    </div>
  </div>

  <div id="result" class="result"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
